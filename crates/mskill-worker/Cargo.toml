[package]
name = "mskill-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mskill-protocol = { path = "../mskill-protocol" }
worker = { version = "=0.8.7", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey", "console"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
