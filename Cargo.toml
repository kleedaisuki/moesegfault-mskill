[workspace]
members = [
    "crates/mskill-protocol",
    "crates/mskill-core",
    "crates/mskill-auth",
    "crates/mskill-cli",
    "crates/mskill-worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/kleedaisuki/moesegfault-mskill"

[workspace.dependencies]
mskill-protocol = { path = "crates/mskill-protocol" }
mskill-core = { path = "crates/mskill-core" }
mskill-auth = { path = "crates/mskill-auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
